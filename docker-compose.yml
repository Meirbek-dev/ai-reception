services:
  ai-reception:
    build:
      context: .
      dockerfile: ./Dockerfile.php
    container_name: ai-reception
    restart: unless-stopped
    ports:
      - "5040:5040"
    volumes:
      # Persist uploaded documents
      - uploads:/app/storage/app/uploads
      # Persist SQLite database
      - dbdata:/app/database
      # Persist OCR cache (optional, can be dropped without data loss)
      - ocrcache:/app/storage/app/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://ai-reception.tou.edu.kz
      - TESSDATA_PREFIX=/usr/share/tessdata/
      - SESSION_DRIVER=cookie
      - SESSION_ENCRYPT=true
    env_file:
      - api/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5040/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
    name: ai_reception_uploads
  dbdata:
    name: ai_reception_db
  ocrcache:
    name: ai_reception_ocrcache
