[supervisord]
nodaemon=true
logfile=/app/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/php-fpm.log
stderr_logfile=/app/storage/logs/php-fpm-error.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/nginx.log
stderr_logfile=/app/storage/logs/nginx-error.log

[program:scheduler]
; Runs `php artisan schedule:run` every minute — equivalent to cron
command=/bin/sh -c "while true; do php /app/artisan schedule:run --no-interaction >> /app/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/scheduler.log
stderr_logfile=/app/storage/logs/scheduler-error.log
